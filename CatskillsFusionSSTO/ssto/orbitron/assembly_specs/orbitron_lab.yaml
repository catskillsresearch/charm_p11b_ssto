schema_version: 2
assembly:
  id: orbitron_lab
  title: Orbitron Phase 1+2 R&D stand (Reply 19 SSOT)
  radial_thermal_stack: &id_radial
    r_cathode_m: 0.01
    r_first_wall_m: 0.04
    r_air_outer_m: 0.06
    r_cryostat_outer_m: 0.075
    r_magnet_outer_m: 0.10
    length_m: 1.2
  narrative: "CadQuery assembly mirrors **proton_boron_rand.md Reply 19** subassemblies. **Fuel:**\
    \ solid **\xB9\xB9B** disks + **355 nm** laser ablation (Reply 9, 11\u201312)\u2014not\
    \ solid B-11. Integrated pad adds **H\u2082** proton feed and **CH\u2084** wall-thermal\
    \ (not in Phase 1 BOM)."
logical:
  root: test_stand
  scene_root_name: fusion_arcjet_engine
  glossary:
  - term: Orbitron-class core (topology)
    definition: "Magneto-electrostatic hybrid per ``orbitron_avalanche_core.yaml`` \u2014\
      \ inspired by Avalanche\u2019s public\n**D\u2082** Orbitron geometry only. **p-\xB9\xB9\
      B** fuel and **~600 kV** excitation are Catskills assumptions,\nnot Avalanche publications.\n"
  - term: Orbitrap (ion confinement)
    definition: "Ions trapped in **elliptical orbits** between outer anode (+) and central\
      \ cathode (\u2212) by\nelectrostatic potential\u2014not by striking internal accelerator\
      \ grids (contrast fusor).\n"
  - term: Magnetron electron confinement
    definition: "Weak axial **B** traps electrons; combined with radial **E** they **E\xD7\
      B drift** azimuthally,\nco-rotating with ions to mask space-charge repulsion and raise\
      \ achievable density.\n"
  - term: Tangential ion injection
    definition: "External injectors fire ionized fuel **tangentially** into the anode\u2013\
      cathode gap at **~10\u2013100+ keV**\nso ions miss the cathode rod and stay in closed\
      \ orbits (Avalanche public narrative).\n"
  - term: Rotating mode (instability)
    definition: "Azimuthal plasma instability that concentrates the discharge and dumps particles\
      \ to walls\u2014\nlimiting density. Mitigation in Avalanche\u2019s public arc includes\
      \ **cathode pulsing** and\n**rotational shear** (PSP2 / Jin program); simulated in FG\
      \ via ``/controls/orbitron/cathode-pulse``.\n"
  - term: Annulus
    definition: 'A ring-shaped passage: fluid moves in the gap between two concentric surfaces
      (for example between an outer duct wall and an inner core or plug). It is used to route
      bypass air, condition shocks, or feed gas around a central module before it rejoins
      a core or nozzle.'
  - term: Blast / shock detuner
    definition: A short fluidic insert or multi-port cavity whose job is to tame abrupt pressure
      spikes (blasts or strong shocks) so upstream hardware sees gentler gradients. This lab
      mesh splits the coarse module into an annulus sleeve, a central insert, and a bolting
      / seal flange at the nozzle interface.
  - term: "CD (convergent\u2013divergent) nozzle"
    definition: A supersonic nozzle with a converging section, a minimum-area throat, and
      a diverging section. The lab exports three coarse solids (inlet plenum adapter, throat-forward
      CD segment, divergent exit) that tile axially behind the reactor outlet ring.
  - term: Ion beam injectors (NBI)
    definition: "**Tangential keV ion beam** hardware on the core\u2014not a low-energy gas\
      \ bleed. FG throttle\ncommands **beam current (mA)** toward the **>1 mA** design-validation\
      \ target.\n"
  - term: "p-\xB9\xB9B headline channel"
    definition: "After dissociation in the discharge: ``\xB9H + \xB9\xB9B \u2192 3 \u2074\
      He``. **B\u2081\u2080H\u2081\u2084** is the boron carrier;\n**H\u2082** supplies hydrogenic\
      \ / proton inventory\u2014same tangential beam hardware as a D\u2082 Orbitron.\n"
  - term: "Hydrogen injectant (H\u2082)"
    definition: "**H\u2082** tank + ``Hydrogen_Trunk_Line`` feed tangential keV injectors\
      \ (stability, laminarity,\nproton side of p-\xB9\xB9B). Not bottled fusion-product helium.\n"
  - term: "Boron injectant (B\u2081\u2080H\u2081\u2084)"
    definition: "**B\u2081\u2080H\u2081\u2084** tank + ``Boron_Trunk_Line`` feed the **same**\
      \ injectors\u2014gaseous boron carrier, not solid B.\n"
  - term: "Helium ash (\u2074He product)"
    definition: "Fusion alphas from p-\xB9\xB9B vent via ``Helium_Ash_Vent_Line`` into the\
      \ nozzle plenum\u2014not from supply tanks.\n"
  - term: Cryo methane (wall thermal)
    definition: "**Liquid CH\u2084** annulus cooling for anode / boundary heat (U2 in ``UNOBTANIUM.md``).\
      \ Optional on the\npad mesh for early integration; physically required for steady full-power\
      \ wall loads.\n"
  - term: Reference plant (fusion-heated Brayton)
    definition: "**Air** ingested at **\u2212X**, compressed on a **shaft**, heated in the\
      \ **annulus** (wall losses)\nand **plenum mixer** (hot core exhaust + \u2074He ash),\
      \ expanded in a **turbine** that powers the\n**compressor** after pad start, then expanded\
      \ in the **nozzle** for thrust. Canonical write-up:\n``orbitron_reference_plant.yaml``.\n"
  - term: Pad startup APU
    definition: "**Pad_Startup_Cart** (ground power skid) \u2192 **Pad_Startup_Power_Cable**\
      \ \u2192 **Pad_Startup_Motor**\non the compressor spool. Rig-only; **excluded from flight\
      \ mass**; disconnected after the\nturbine drives the compressor.\n"
  - term: Liquid methane thermal loop
    definition: "Cryogenic liquid CH\u2084 used as a working fluid for **anode / boundary\
      \ Bremsstrahlung heat removal** and related plant cryogenics in this concept; it is\
      \ **not** the boron carrier. In the lab glTF, routing is through ``Cryo_Methane_Piping``\
      \ under ``methane_tank_assy`` (the redundant CH\u2084 leg on the old combined injectant\
      \ trunk was removed)."
  - term: Engine mount frame
    definition: "``Engine_Mount_Frame`` on ``thrust_sled`` \u2014 four posts on the load-cell\
      \ tops and a shared plate (`engine_mount_frame` in ``arcjet_test_stand_cad.py``). The\
      \ air-breathing engine pivot (`ENGINE_MOUNT_TOP_Z`) sits on that plate so the mesh shows\
      \ a continuous load path: cells \u2192 posts \u2192 plate \u2192 engine."
  - term: Thrust-sled load telemetry
    definition: "Four corner **load-cell pucks** on ``thrust_sled`` (`LoadCell_0`\u2026`3`)\
      \ represent pad bookkeeping, not strain-gauge FEA. **Thrust** and **airflow (mdot)**\
      \ come from the JSBSim bilinear surrogate (``/controls/reactor/throttle``, ``/controls/orbitron/compressor``).\
      \ Corner **lbf** values and **sled-load-total** are computed in ``orbitron-jsbsim.xml``\
      \ from coeffs in ``orbitron_physics_surrogate.yaml`` (`thrust_sled_load_cells`) and\
      \ shown on the operator **Screen** via ``orbitron_nasal.yaml``. See ``assembly_specs/README.md``."
  connections:
  - from: Tank_Hydrogen
    to: Pipe_H2_Feed
    label: tank fitting / flex jumper
    kind: dotted
  - from: Tank_Cryo_Methane
    to: Pipe_CH4_Feed
    label: CH4 service from cryo methane tank
    kind: dotted
  - from: Q_Switched_NdYAG_Laser
    to: UV_Fused_Silica_Viewport
    label: 355 nm beam — atmospheric laser to vacuum window (1.3)
    kind: dotted
  - from: UV_Fused_Silica_Viewport
    to: Solid_Boron_11_Target
    label: laser ablation focus on enriched 11B disk (1.2)
    kind: dotted
  - from: Pipe_H2_Feed
    to: Hydrogen_Trunk_Line
    label: H2 feed toward tangential ion beam injectors
    kind: dotted
  - from: Hydrogen_Trunk_Line
    to: NBI_Injector
    label: H2 tangential keV beam service
    kind: solid
  - from: Solid_Boron_11_Target
    to: NBI_Injector
    label: ablated B+ tangential keV service
    kind: solid
  - from: Fusion_Hot_Gas_Outlet
    to: Helium_Ash_Vent_Line
    label: "fusion \u2074He ash bleed from core exhaust plane"
    kind: dotted
  - from: Helium_Ash_Vent_Line
    to: Nozzle_Inlet_Plenum
    label: helium ash vents into nozzle plenum / jet mix
    kind: solid
  - from: Cryo_Methane_Piping
    to: Tank_Cryo_Methane
    label: cryostat / fill circuit (schematic)
    kind: dotted
  - from: Cryo_Methane_Piping
    to: Compressor_Assembly
    label: intercooling / heat rejection tie (concept)
    kind: dotted
  - from: High_Voltage_Umbilical
    to: Central_Cathode_Wire
    label: HV feed toward cathode stack (schematic)
    kind: dotted
  - from: Pad_Startup_Cart
    to: Pad_Startup_Power_Cable
    label: "APU cart receptacle \u2192 starter power cable"
    kind: dotted
  - from: Pad_Startup_Power_Cable
    to: Pad_Startup_Motor
    label: "starter power cable \u2192 intake motor pod"
    kind: dotted
  - from: Pad_Startup_Motor
    to: Compressor_Assembly
    label: "pad electric starter \u2192 compressor spool (light-off only)"
    kind: dotted
  - from: Bellmouth_Inlet
    to: Compressor_Assembly
    label: "inlet \u2192 compressor"
    kind: solid
  - from: Compressor_Assembly
    to: Reactor_Bay_Inlet_Shroud
    label: compressor discharge into reactor bay annulus jacket (outer shell)
    kind: solid
  - from: Reactor_Bay_Inlet_Shroud
    to: Turbine_Assembly
    label: hot mixed gas toward turbine (fusion-heated Brayton spool)
    kind: solid
  - from: Turbine_Assembly
    to: Nozzle_Inlet_Plenum
    label: turbine discharge into nozzle plenum
    kind: solid
  - from: Reactor_Bay_Inlet_Shroud
    to: Magnet
    label: jacket bridges gap to solenoid shell; bore clears niobium / plasma boundary
    kind: solid
  - from: Reactor_Bay_Inlet_Shroud
    to: BD_Annulus_Sleeve
    label: same annulus / bypass circuit continues downstream toward detuner
    kind: dotted
  - from: BD_Annulus_Sleeve
    to: BD_Shock_Detuner_Core
    label: annulus gas into detuner throat
    kind: solid
  - from: BD_Shock_Detuner_Core
    to: BD_Bracket_Seals
    label: pressure loads & seals
    kind: solid
  - from: BD_Shock_Detuner_Core
    to: Magnet
    label: shock management near magnetic volume (concept)
    kind: dotted
  - from: Fusion_Hot_Gas_Outlet
    to: Nozzle_Inlet_Plenum
    label: "core exhaust plane \u2192 nozzle inlet"
    kind: solid
  - from: Nozzle_Inlet_Plenum
    to: Nozzle_CD_Contour
    label: "inlet conditioning \u2192 CD contour"
    kind: solid
  - from: Nozzle_CD_Contour
    to: Nozzle_Exit_Hardware
    label: "contour \u2192 exit struts / flange"
    kind: solid
  - from: Nozzle_Inlet_Plenum
    to: Fusion_Hot_Gas_Outlet
    label: axis / interface alignment
    kind: dotted
  - from: BD_Bracket_Seals
    to: Nozzle_Inlet_Plenum
    label: detuner flange mates nozzle plenum
    kind: dotted
  groups:
    test_stand:
      title: Orbitron R&D test stand (Reply 19 Phase 1 + 2)
      detail: "CadQuery assembly mirrors **proton_boron_rand.md Reply 19** subassemblies.\
        \ **Fuel:** solid **\xB9\xB9B** disks + **355 nm** laser ablation (Reply 9, 11\u2013\
        12)\u2014not solid B-11. Integrated pad adds **H\u2082** proton feed and **CH\u2084\
        ** wall-thermal (not in Phase 1 BOM)."
      members:
      - phase_1_benchtop
      - phase_2_wind_tunnel
      - integrated_pad_services
    phase_1_benchtop:
      title: "Phase 1 \u2014 Benchtop physics demo"
      detail: "Validate p-\xB9\xB9B cross-section and laminar Orbitron on laboratory scale\
        \ (~$91k BOM)."
      members:
      - subassembly_1_1_vacuum_chamber_system
      - subassembly_1_2_electrostatic_orbitron_core
      - subassembly_1_3_laser_ablation_system
      - subassembly_1_4_hv_power_safety
      - subassembly_1_5_diagnostics_particle_detection
    subassembly_1_1_vacuum_chamber_system:
      title: "Subassembly 1.1 \u2014 Vacuum & Chamber System"
      detail: "UHV for electrostatic orbits and laser-ablation **\xB9\xB9B** injection."
      parts:
      - Vacuum_Chamber
      - Turbomolecular_Pump
      - Roughing_Pump
      - Full_Range_Vacuum_Gauge
      - UV_Fused_Silica_Viewport
      - Solid_B11_Target_Holder
    subassembly_1_2_electrostatic_orbitron_core:
      title: "Subassembly 1.2 \u2014 Electrostatic Orbitron Core"
      detail: "Inside-out: cathode \u2192 plasma vacuum \u2192 hot first wall (anode) \u2192\
        \ future air annulus \u2192 cryostat \u2192 HTS magnet outside. p-\xB9\xB9B fueling\
        \ via NBI + solid \xB9\xB9B; not a single \"jacket = magnet\" part."
      parts:
      - Central_Cathode_Wire
      - Outer_Anode_Grid
      - Air_Annulus_Channel
      - Cryostat_Vacuum_Gap
      - HV_Vacuum_Feedthrough
      - Solid_Boron_11_Target
      - Solid_Boron_11_Target_2
      - Magnet
      - NBI_Injector
      - Insulators
    subassembly_1_3_laser_ablation_system:
      title: "Subassembly 1.3 \u2014 Laser Ablation System"
      detail: "Q-switched **Nd:YAG** 355 nm \u2014 cold ablation of solid **\xB9\xB9B** (Reply\
        \ 11\u201312)."
      parts:
      - Q_Switched_NdYAG_Laser
      - Optical_Breadboard
      - UV_Focusing_Lens
      - Laser_Power_Meter
      - Kinematic_Mirror_Mounts
    subassembly_1_4_hv_power_safety:
      title: "Subassembly 1.4 \u2014 High-Voltage Power & Safety"
      detail: Spellman-class DC bias, ballast, vacuum/interlock shutdown.
      parts:
      - Precision_DC_HVPS
      - High_Voltage_Cable
      - Ballast_Resistor
      - Interlock_Safety_Controller
      - High_Voltage_Umbilical
    subassembly_1_5_diagnostics_particle_detection:
      title: "Subassembly 1.5 \u2014 Diagnostics & Particle Detection"
      detail: 3-alpha signature via PIPS + MCA; Faraday cup for beam current.
      parts:
      - Charged_Particle_Detector
      - Preamplifier
      - Spectroscopy_Amplifier
      - Multichannel_Analyzer_MCA
      - Faraday_Cup
    phase_2_wind_tunnel:
      title: "Phase 2 \u2014 Stationary wind tunnel rig"
      detail: Full-scale jacket, Brayton spool, ground blower, MW HV, DAQ (~$697k BOM).
      members:
      - subassembly_2_1_engine_core_heat_exchanger
      - subassembly_2_2_turbomachinery_airflow
      - subassembly_2_3_ground_support_blower
      - subassembly_2_4_mw_power_starting
      - subassembly_2_5_thermal_aerodynamic_instrumentation
      - air_breathing_nozzle_train
    subassembly_2_1_engine_core_heat_exchanger:
      title: "Subassembly 2.1 \u2014 Full-Scale Engine Core & Heat Exchanger"
      detail: "Hot first-wall annulus + bay shroud for Brayton air; HTS magnet outside vacuum\
        \ cryostat (see THERMAL_ZONING.md). Heat: bremsstrahlung + alphas + CX, not neutrons."
      parts:
      - Containment_Vessel_Jacket
      - Heat_Exchanger_Channels
      - Aerodynamic_Centerbody
      - High_Temp_Metallic_Seals
      - Reactor_Bay_Inlet_Shroud
      - Fusion_Hot_Gas_Outlet
    subassembly_2_2_turbomachinery_airflow:
      title: "Subassembly 2.2 \u2014 Turbomachinery & Air Flow Conditioning"
      detail: "Brayton: compressor \u2192 hot jacket \u2192 turbine (Reply 15 startup sequence)."
      parts:
      - Compressor_Assembly
      - Turbine_Assembly
      - Compressor_Shaft_Bearings
      - Inlet_Guide_Vanes_IGVs
      - Bellmouth_Inlet
    subassembly_2_3_ground_support_blower:
      title: "Subassembly 2.3 \u2014 Ground Support Blower (wind tunnel)"
      detail: Simulates ram-air / S-duct distortion before compressor.
      parts:
      - Industrial_Blower
      - S_Duct_Intake_Simulation
      - Exhaust_Silencer_Ducting
      - Airflow_Honeycomb_Filter
    subassembly_2_4_mw_power_starting:
      title: "Subassembly 2.4 \u2014 Megawatt-Scale Power & Starting"
      detail: Pneumatic starter, Marx 600 kV class, turbo pump array, HV bushing.
      parts:
      - Pneumatic_Air_Starter
      - Solid_State_Marx_Generator
      - HV_Bushing_Feedthrough
      - Vacuum_Turbo_Pump_Array
      - Pad_Startup_Cart
      - Pad_Startup_Power_Cable
      - Pad_Startup_Motor
    subassembly_2_5_thermal_aerodynamic_instrumentation:
      title: "Subassembly 2.5 \u2014 Thermal & Aerodynamic Instrumentation"
      detail: PXIe DAQ, thermocouples, pitot, mass flow, pyrometers.
      parts:
      - High_Temp_Thermocouples
      - Pitot_Static_Tubes
      - Mass_Flow_Sensor
      - Infrared_Pyrometer
      - Data_Acquisition_Chassis
    air_breathing_nozzle_train:
      title: Nozzle & bypass (lab segmentation)
      detail: "CD nozzle + blast detuner \u2014 lab mesh segments beyond Reply 19 tables."
      parts:
      - Nozzle_Inlet_Plenum
      - Nozzle_CD_Contour
      - Nozzle_Exit_Hardware
      - BD_Annulus_Sleeve
      - BD_Shock_Detuner_Core
      - BD_Bracket_Seals
      - Helium_Ash_Vent_Line
    integrated_pad_services:
      title: Integrated pad services (extension)
      detail: "Operator station, thrust sled, **H\u2082** proton inventory, **CH\u2084** wall\
        \ thermal."
      members:
      - control_panel_stand
      - thrust_sled
      - proton_and_thermal_farm
    proton_and_thermal_farm:
      title: Proton feed & wall-thermal farm
      detail: "**H\u2082** for p-\xB9\xB9B; **CH\u2084** for U2 cooling \u2014 not boron carriers."
      parts:
      - Tank_Farm_Platform
      - Tank_Hydrogen
      - Decal_H2
      - Pipe_H2_Feed
      - Hydrogen_Trunk_Line
      - Tank_Cryo_Methane
      - Decal_CH4
      - Pipe_CH4_Feed
      - Cryo_Methane_Piping
    proton_h2_feed:
      title: H\u2082 proton inventory (report INJ-H2-01 hero)
      detail: "Tank farm **without** operator console \u2014 use for assembly report, not\
        \ ``integrated_pad_services``."
      parts:
      - Tank_Farm_Platform
      - Tank_Hydrogen
      - Decal_H2
      - Pipe_H2_Feed
      - Hydrogen_Trunk_Line
    thermal_ch4_feed:
      title: CH\u2084 wall-thermal loop (report U2-CH4-01 hero)
      detail: "Cryo methane loop **without** operator console or H\u2082 tanks."
      parts:
      - Tank_Cryo_Methane
      - Decal_CH4
      - Pipe_CH4_Feed
      - Cryo_Methane_Piping
      - Magnet_Service_Bosses
    control_panel_stand:
      title: Control panel and operator station
      detail: "Reply 15/18 startup: APU \u2192 starter \u2192 bleed \u2192 vacuum OK \u2192\
        \ laser \u2192 HV \u2192 ignite."
      parts:
      - Operator_Console
      - Operator_Checklist_Plaque
      - Operator_Checklist_Ink
      - Operator_Panel
      - Screen
      - Big_Red_Button
      - Panel_Label_APU
      - Panel_Label_STARTER
      - Panel_Label_BLEED
      - Panel_Label_VAC
      - Panel_Label_LASER
      - Panel_Label_HV
      - Panel_Label_IGNITE
      - Panel_Label_BEAM
      - Panel_Label_COMP
    thrust_sled:
      title: Thrust sled
      parts:
      - Rail_Left
      - Rail_Right
      - Thrust_Sled_Frame
      - LoadCell_0
      - LoadCell_1
      - LoadCell_2
      - LoadCell_3
      - Engine_Mount_Frame
instances:
  Thrust_Sled_Frame:
    narrative: 'Longitudinal rails, cross ties, and deck slab from arcjet_test_stand_cad;
      sits

      slightly dropped in Z so the deck top matches the bell pivot height used by the

      engine YAMLs.

      '
    template: thrust_sled_frame
    params:
      length: 2.2
      width: 1.0
      rail_h: 0.08
    color:
    - 0.35
    - 0.35
    - 0.38
    transform_chain:
    - op: translate
      xyz:
      - 0.0
      - 0.0
      - -0.12
  Rail_Left:
    narrative: 'Filleted beam spanning the pad along local X at +Y rail index; supports the
      sled

      rails narrative even though the mesh is only a stand-in block.

      '
    template: rail_beam
    params:
      span: 3.5
    color:
    - 0.35
    - 0.35
    - 0.38
    transform_chain:
    - op: translate
      xyz:
      - 0.0
      - 0.55
      - -0.1
  Rail_Right:
    narrative: "Partner rail at \u2212Y; keep parallel to Rail_Left so the sled can translate\
      \ axially\nunder thrust without yawing (conceptually\u2014no wheel detail in this coarse\
      \ mesh).\n"
    template: rail_beam
    params:
      span: 3.5
    color:
    - 0.35
    - 0.35
    - 0.38
    transform_chain:
    - op: translate
      xyz:
      - 0.0
      - -0.55
      - -0.1
  Tank_Hydrogen:
    narrative: "Reply 19 BOM \u2014 see ``SOLID_B11_LASER_FUEL.md``."
    template: reply19_tank_hydrogen
    params: &id001 {}
    color: &id002
    - 0.35
    - 0.35
    - 0.38
    transform_chain: &id003 []
  Tank_Farm_Platform:
    narrative: "Steel skid under the +Y **fuel farm** row\u2014thin deck (tank bases at z=0)\
      \ and four corner posts sized to the same XY layout as ``Tank_Hydrogen``, ``Solid_Boron_11_Target``,\
      \ and ``Tank_Cryo_Methane`` in ``LabInfrastructure.build_fuel_farm()``.\n"
    template: lab_tank_farm_platform
    params: {}
    color:
    - 0.33
    - 0.33
    - 0.36
    transform_chain: []
  Tank_Cryo_Methane:
    narrative: "Reply 19 BOM \u2014 see ``SOLID_B11_LASER_FUEL.md``."
    template: reply19_tank_cryo_methane
    params: *id001
    color: *id002
    transform_chain: *id003
  Decal_H2:
    narrative: "Flat stencil text \u201CHYDROGEN\u201D on the tank\u2014marking only, not\
      \ a separate fluid."
    template: lab_decal_h2
    params: {}
    color:
    - 0.9
    - 0.9
    - 0.9
    transform_chain: []
  Decal_CH4:
    narrative: "Dark \u201CLIQUID METHANE\u201D stencil on the cryo dewar\u2014marks the **thermal\
      \ / cryogenic** CH\u2084 inventory (anode / plant cooling loop), not the boron carrier.\n"
    template: lab_decal_ch4
    params: {}
    color:
    - 0.1
    - 0.1
    - 0.1
    transform_chain: []
  High_Voltage_Umbilical:
    narrative: 'Schematic high-voltage umbilical from the operator console toward the reactor

      solenoid shell (reference lab art: orange service reaches the magnet crown, not a

      buried cathode tap). Real sequencing and interlocks stay in Nasal / XML; this

      mesh only shows a plausible bus run the operator can see.

      '
    template: lab_hv_umbilical
    params:
      include_port_markers: false
      connectivity_spec:
        physical_story: "The console cluster energizes / supervises the core. The visible\
          \ **orange** bus is schematic:\nit runs to a **ceramic feedthrough boss** on the\
          \ solenoid OD (``Magnet_Service_Bosses``)\u2014console\npotential into the **yoke\
          \ / magnet circuit** in this coarse mesh, not a cathode pigtail.\n"
        links:
        - link_id: hv_service
          service: high_voltage_schematic
          from_region: operator_console_cluster
          to_region: reactor_magnet_shell
          routing_intent: jog_clear_screen_then_climb_to_magnet_crown
      connector_ports:
      - id: console_hv_header
        anchor: console_hv_header
        offset:
        - 0.0
        - 0.0
        - 0.0
        description: HV header beside the shifted console / screen cluster.
      - id: reactor_magnet_hv_feed
        anchor: reactor_magnet_hv_feed
        offset:
        - 0.0
        - 0.0
        - 0.0
        description: 'HV feedthrough boss on the solenoid OD (see ``Magnet_Service_Bosses``;
          co-located anchor

          in ``LabInfrastructure.magnet_shell_connector_anchors``).

          '
      connector_links:
