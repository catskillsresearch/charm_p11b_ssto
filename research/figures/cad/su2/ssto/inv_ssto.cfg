%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 — coarse 3D Euler on voxel-remeshed CHARM SSTO (poster / digital tunnel)
% M=0.3, α=4°, WALL + FARFIELD. Not a BL-resolved RANS mesh.
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

MACH_NUMBER= 0.3
AOA= 4.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15

REF_ORIGIN_MOMENT_X= 27.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 3.0
REF_LENGTH= 54.0
REF_AREA= 200.0
REF_DIMENSIONALIZATION= FREESTREAM_PRESS_EQ_ONE

MARKER_EULER= ( WALL )
MARKER_FAR= ( FARFIELD )
MARKER_PLOTTING= ( WALL )
MARKER_MONITORING= ( WALL )

NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 5.0
CFL_ADAPT= NO
ITER= 400

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10

CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT

CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

MESH_FILENAME= ssto_farfield.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out.su2

OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_PARAVIEW, SURFACE_CSV )
TABULAR_FORMAT= CSV
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, LIFT, DRAG )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )

WRT_FORCES_BREAKDOWN= NO
